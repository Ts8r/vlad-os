name: VLAD OS · Release

# Publie une release quand tu tagues une version (v0.5.0, v1.0.0…).
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci || npm install
      - run: npm run build

      - name: Bundle l'OS (sans node_modules ni .env)
        run: |
          zip -r vlad-os.zip . \
            -x "node_modules/*" ".git/*" ".env" "ui/dist/*"

      - name: Crée la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: vlad-os.zip
          generate_release_notes: true
